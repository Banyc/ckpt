[package]
name = "ckpt"
version = "0.1.0"
edition = "2024"
description = "Record book for checkpoint flags: sessions, ctf flags, and verification hits."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
storekit = { git = "https://github.com/Banyc/storekit", tag = "v0.1.0" }
getrandom = "0.4.3"
jiff = { version = "0.2.37", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
